<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prachiti's Playful Punishment Chamber</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fdf2f8; /* Soft pastel pink */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Comic Sans MS', sans-serif;
            overflow: hidden;
        }

        #comic-container {
            position: relative;
            max-width: 95vw;
            max-height: 95vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border-radius: 15px;
            overflow: hidden;
        }

        #base-image {
            display: block;
            max-width: 100%;
            max-height: 95vh;
            width: auto;
            height: auto;
            transition: transform 0.1s ease-in-out;
        }

        /* Invisible clickable areas over the drawn buttons */
        .click-zone {
            position: absolute;
            right: 4%;
            width: 25%;
            height: 15%;
            cursor: pointer;
            z-index: 10;
            border-radius: 10px;
            transition: background-color 0.2s;
        }

        /* Add a slight highlight on hover so she knows it's clickable */
        .click-zone:hover {
            background-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .click-zone:active {
            background-color: rgba(255, 255, 255, 0.5);
        }

        #zone-slap { top: 18%; }
        #zone-kick { top: 37%; }
        #zone-cake { top: 55%; }
        #zone-floral { top: 73%; }

        /* Animation Overlays */
        .anim-element {
            position: absolute;
            pointer-events: none;
            z-index: 20;
            font-size: 4rem;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.3));
        }

        /* Sangram's Screen Shake */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-3px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        .shake-img { animation: shake 0.4s; }

        /* Slap Animation: Hand flies from right to face */
        @keyframes slapFly {
            0% { top: 25%; left: 80%; transform: scale(1.5) rotate(-20deg); opacity: 0; }
            50% { opacity: 1; }
            90% { top: 28%; left: 33%; transform: scale(1) rotate(0deg); opacity: 1; }
            100% { top: 28%; left: 33%; transform: scale(2) rotate(15deg); opacity: 0; }
        }
        .anim-slap { animation: slapFly 0.5s forwards ease-in; }

        /* Kick Animation: Boot flies from left to bike */
        @keyframes kickFly {
            0% { top: 60%; left: -20%; transform: scale(2) rotate(-45deg); opacity: 0; }
            50% { opacity: 1; }
            90% { top: 55%; left: 30%; transform: scale(1.5) rotate(0deg); opacity: 1; }
            100% { top: 55%; left: 35%; transform: scale(2) rotate(20deg); opacity: 0; }
        }
        .anim-kick { animation: kickFly 0.6s forwards ease-in; }

        /* Cake Splat: Flies from Prachiti's wand to Sangram */
        @keyframes cakeFly {
            0% { top: 27%; left: 50%; transform: scale(0.2) rotate(0deg); opacity: 1; }
            90% { top: 28%; left: 33%; transform: scale(1.2) rotate(360deg); opacity: 1; }
            100% { top: 28%; left: 33%; transform: scale(1.5); opacity: 0; }
        }
        .anim-cake { animation: cakeFly 0.5s forwards linear; }

        /* Splat mark left behind */
        .splat-mark {
            position: absolute;
            font-size: 5rem;
            pointer-events: none;
            z-index: 15;
            animation: splatFade 3s forwards;
        }
        @keyframes splatFade {
            0% { transform: scale(0); opacity: 1; }
            10% { transform: scale(1); opacity: 1; }
            80% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }

        /* Floral Rain */
        @keyframes floralFall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(300px) rotate(360deg); opacity: 0; }
        }
        .anim-flower {
            position: absolute;
            font-size: 2.5rem;
            pointer-events: none;
            z-index: 25;
            animation: floralFall 2s forwards linear;
        }

        /* Prachiti Wand Sparkle */
        @keyframes wandSparkle {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(2); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
        .wand-spark {
            position: absolute;
            top: 26%;
            left: 48%;
            font-size: 2rem;
            pointer-events: none;
            z-index: 30;
            opacity: 0;
        }
        .sparking { animation: wandSparkle 0.3s forwards; opacity: 1; }

    </style>
</head>
<body>

    <div id="comic-container">
        <!-- The Base Comic Image -->
        <img src="watermarked_img_14696227436466322454.png" id="base-image" alt="Prachiti's Punishment Chamber">

        <!-- Clickable Zones matching the drawn buttons -->
        <div id="zone-slap" class="click-zone" onclick="triggerSlap()" title="Click to Slap!"></div>
        <div id="zone-kick" class="click-zone" onclick="triggerKick()" title="Click to Kick!"></div>
        <div id="zone-cake" class="click-zone" onclick="triggerCake()" title="Click to Throw Cake!"></div>
        <div id="zone-floral" class="click-zone" onclick="triggerFloral()" title="Click for Floral Sentence!"></div>
        
        <!-- Magic Wand Sparkle Position -->
        <div id="magic-spark" class="wand-spark">✨</div>
    </div>

    <script>
        const container = document.getElementById('comic-container');
        const img = document.getElementById('base-image');
        const spark = document.getElementById('magic-spark');

        // Simple Audio Synthesizer for impact sounds
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'slap') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(); osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'kick') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.8, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                osc.start(); osc.stop(ctx.currentTime + 0.2);
            } else if (type === 'cake') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'magic') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(1200, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
                osc.start(); osc.stop(ctx.currentTime + 0.5);
            }
        }

        function shakeImage() {
            img.classList.remove('shake-img');
            void img.offsetWidth; // trigger reflow
            img.classList.add('shake-img');
        }

        function triggerMagic() {
            spark.classList.remove('sparking');
            void spark.offsetWidth;
            spark.classList.add('sparking');
            playSound('magic');
        }

        function triggerSlap() {
            triggerMagic();
            
            const hand = document.createElement('div');
            hand.innerText = '👋';
            hand.className = 'anim-element anim-slap';
            container.appendChild(hand);

            setTimeout(() => {
                playSound('slap');
                shakeImage();
            }, 400); // Shake when hand lands

            setTimeout(() => hand.remove(), 600);
        }

        function triggerKick() {
            triggerMagic();
            
            const boot = document.createElement('div');
            boot.innerText = '🥾';
            boot.className = 'anim-element anim-kick';
            container.appendChild(boot);

            setTimeout(() => {
                playSound('kick');
                shakeImage();
            }, 500); // Shake when boot lands

            setTimeout(() => boot.remove(), 700);
        }

        function triggerCake() {
            triggerMagic();
            
            const cake = document.createElement('div');
            cake.innerText = '🎂';
            cake.className = 'anim-element anim-cake';
            container.appendChild(cake);

            setTimeout(() => {
                playSound('cake');
                
                // Leave a splat mark on Sangram's face/bike!
                const splat = document.createElement('div');
                splat.innerText = '🧁';
                splat.className = 'splat-mark';
                // Randomize splat location slightly around center
                const topOffset = 25 + (Math.random() * 15);
                const leftOffset = 28 + (Math.random() * 15);
                splat.style.top = `${topOffset}%`;
                splat.style.left = `${leftOffset}%`;
                container.appendChild(splat);
                
                setTimeout(() => splat.remove(), 3000);
            }, 450); // Splat sound when hits

            setTimeout(() => cake.remove(), 600);
        }

        function triggerFloral() {
            triggerMagic();
            
            const flowers = ['🌸', '🌺', '🌼', '🌻', '🌷'];
            
            // Drop 15 flowers
            for(let i = 0; i < 15; i++) {
                setTimeout(() => {
                    const flower = document.createElement('div');
                    flower.innerText = flowers[Math.floor(Math.random() * flowers.length)];
                    flower.className = 'anim-flower';
                    
                    // Spread over Sangram/Bike area
                    const startLeft = 20 + (Math.random() * 30);
                    const startTop = 10 + (Math.random() * 20);
                    
                    flower.style.left = `${startLeft}%`;
                    flower.style.top = `${startTop}%`;
                    
                    container.appendChild(flower);
                    
                    setTimeout(() => flower.remove(), 2000);
                }, i * 100);
            }
        }
    </script>
</body>
</html>

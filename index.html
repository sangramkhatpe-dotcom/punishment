<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prachiti's Punishment Chamber</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fdf2f8;
            background-image: radial-gradient(#fbcfe8 2px, transparent 2px);
            background-size: 30px 30px;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            overflow: hidden;
        }

        /* Avatar Container */
        #avatar-container {
            position: relative;
            display: inline-block;
            margin-top: 2rem;
        }

        /* The Doll (Your Face) */
        #sangram-avatar {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            border: 8px solid #fbcfe8;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        /* Kick Animation: Tossed to the side and spinning */
        @keyframes kickAnim {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(100px, -50px) rotate(45deg); }
            40% { transform: translate(150px, 0px) rotate(90deg); }
            60% { transform: translate(100px, 50px) rotate(45deg); }
            80% { transform: translate(50px, 20px) rotate(20deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .animate-kick {
            animation: kickAnim 0.8s ease-in-out;
        }

        /* Slap Animation: Shaking violently left and right */
        @keyframes slapAnim {
            0% { transform: translateX(0) rotate(0deg); }
            15% { transform: translateX(-30px) rotate(-15deg); }
            30% { transform: translateX(30px) rotate(15deg); }
            45% { transform: translateX(-20px) rotate(-10deg); }
            60% { transform: translateX(20px) rotate(10deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
            100% { transform: translateX(0) rotate(0deg); }
        }
        .animate-slap {
            animation: slapAnim 0.5s ease-in-out;
        }

        /* Cake Splat Element */
        .cake-splat {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            font-size: 150px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .show-cake {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* Floating Emojis */
        .floating-emoji {
            position: absolute;
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.5); }
        }

        /* Cute Buttons */
        .punish-btn {
            transition: all 0.2s;
        }
        .punish-btn:active {
            transform: scale(0.9);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-gray-800 text-center px-4">

    <!-- Header -->
    <div class="bg-white/80 p-6 rounded-3xl shadow-lg border-4 border-pink-200 max-w-2xl w-full">
        <h1 class="text-3xl md:text-4xl font-bold text-pink-500 mb-2">🌸 Prachiti's Apology Station 🌸</h1>
        <p class="text-lg text-gray-600 mb-4">Sangram messed up! Choose your punishment to officially accept the apology.</p>
        
        <!-- Live Reaction Text -->
        <div id="reaction-box" class="h-12 bg-pink-100 rounded-full flex items-center justify-center text-xl font-bold text-pink-600 border-2 border-pink-300">
            Awaiting Prachiti's verdict... 👀
        </div>
    </div>

    <!-- The "Doll" (Your Face) -->
    <div id="avatar-container">
        <!-- Make sure IMG-20261003-WA0240.jpg is in the same folder as this HTML file -->
        <img src="IMG-20261003-WA0240.jpg" alt="Sangram" id="sangram-avatar">
        
        <!-- Hidden Cake Splat -->
        <div id="cake-overlay" class="cake-splat">🎂</div>
    </div>

    <!-- Punishment Control Panel -->
    <div class="mt-8 grid grid-cols-1 md:grid-cols-3 gap-4">
        <button onclick="triggerPunishment('slap')" class="punish-btn bg-yellow-400 hover:bg-yellow-500 text-white font-bold py-4 px-8 rounded-full shadow-lg text-xl border-b-4 border-yellow-600">
            👋 Slap!
        </button>
        
        <button onclick="triggerPunishment('kick')" class="punish-btn bg-red-400 hover:bg-red-500 text-white font-bold py-4 px-8 rounded-full shadow-lg text-xl border-b-4 border-red-600">
            🥾 Kick!
        </button>
        
        <button onclick="triggerPunishment('cake')" class="punish-btn bg-purple-400 hover:bg-purple-500 text-white font-bold py-4 px-8 rounded-full shadow-lg text-xl border-b-4 border-purple-600">
            🍰 Throw Cake!
        </button>
    </div>

    <script>
        const avatar = document.getElementById('sangram-avatar');
        const reactionBox = document.getElementById('reaction-box');
        const cakeOverlay = document.getElementById('cake-overlay');

        // Simple function to play synthesized retro sounds
        function playSound(type) {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (type === 'slap') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start();
                osc.stop(ctx.currentTime + 0.1);
            } else if (type === 'kick') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } else if (type === 'cake') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(1, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                osc.start();
                osc.stop(ctx.currentTime + 0.2);
            }
        }

        function createFloatingEmoji(emoji) {
            const el = document.createElement('div');
            el.className = 'floating-emoji';
            el.innerText = emoji;
            
            // Randomize position near the avatar
            const containerRect = document.getElementById('avatar-container').getBoundingClientRect();
            const randomX = (Math.random() - 0.5) * 150;
            
            el.style.left = `calc(50% + ${randomX}px)`;
            el.style.top = '10%';
            
            document.getElementById('avatar-container').appendChild(el);
            
            setTimeout(() => {
                el.remove();
            }, 1000);
        }

        function triggerPunishment(type) {
            // Reset animations
            avatar.classList.remove('animate-kick', 'animate-slap');
            cakeOverlay.classList.remove('show-cake');
            
            // Force browser reflow to restart animations
            void avatar.offsetWidth; 

            playSound(type);

            if (type === 'slap') {
                avatar.classList.add('animate-slap');
                reactionBox.innerText = "Ouch! A crisp high-five to the face! 👋💢";
                createFloatingEmoji('💫');
                setTimeout(() => createFloatingEmoji('😵'), 200);
            } 
            else if (type === 'kick') {
                avatar.classList.add('animate-kick');
                reactionBox.innerText = "YEET! Sangram goes flying! 🥾💨";
                createFloatingEmoji('🚀');
                setTimeout(() => createFloatingEmoji('🤕'), 300);
            } 
            else if (type === 'cake') {
                cakeOverlay.classList.add('show-cake');
                reactionBox.innerText = "SPLAT! A delicious, humiliating cake! 🎂🧁";
                createFloatingEmoji('✨');
                setTimeout(() => createFloatingEmoji('🍰'), 100);
                
                // Hide cake after 2 seconds
                setTimeout(() => {
                    cakeOverlay.classList.remove('show-cake');
                }, 2000);
            }
        }
    </script>
</body>
</html>

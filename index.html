<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prachiti's Punishment Chamber</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fdf2f8;
            background-image: radial-gradient(#fbcfe8 2px, transparent 2px);
            background-size: 30px 30px;
            overflow-x: hidden;
        }

        /* Sangram Avatar Container */
        .avatar-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 0 auto;
            border-radius: 50%;
            border: 8px solid #fbcfe8;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.3);
            transition: all 0.3s ease;
            background-color: #fff;
            overflow: hidden;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        /* Animations */
        @keyframes kickAnim {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(50px, -50px) rotate(20deg) scale(1.1); }
            40% { transform: translate(100px, 0) rotate(40deg); }
            60% { transform: translate(50px, 50px) rotate(20deg); }
            80% { transform: translate(-20px, 0) rotate(-10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes slapAnim {
            0% { transform: translateX(0) rotate(0deg); filter: hue-rotate(0deg); }
            15% { transform: translateX(-30px) rotate(-15deg); filter: hue-rotate(320deg) contrast(1.5); }
            30% { transform: translateX(30px) rotate(15deg); }
            45% { transform: translateX(-20px) rotate(-10deg); }
            60% { transform: translateX(20px) rotate(10deg); }
            75% { transform: translateX(-10px) rotate(-5deg); }
            100% { transform: translateX(0) rotate(0deg); filter: hue-rotate(0deg); }
        }

        @keyframes cakeAnim {
            0% { transform: scale(1); filter: sepia(0); }
            30% { transform: scale(0.9); filter: sepia(0.5) hue-rotate(310deg); }
            50% { transform: scale(1.05); filter: sepia(0.8) hue-rotate(310deg) brightness(0.8); }

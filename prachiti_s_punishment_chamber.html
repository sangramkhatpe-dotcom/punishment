<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prachiti's Playful Punishment Chamber</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
      --pastel-green: #d1fae5;
      --pastel-pink: #fce7f3;
      --pastel-purple: #f3e8ff;
      --pastel-yellow: #fef3c7;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg-gradient);
      background-image: radial-gradient(#d1fae5 2px, transparent 2px), radial-gradient(#fce7f3 2px, transparent 2px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .fun-font { font-family: 'Fredoka', cursive; }

    /* Glassmorphism Cards */
    .floral-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 3px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 15px 35px -5px rgba(236, 72, 153, 0.15);
    }

    /* Falling Animations for Emojis */
    @keyframes fallDown {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
    .falling-emoji {
      position: fixed;
      z-index: 50;
      pointer-events: none;
      animation: fallDown 3s linear forwards;
      font-size: 2.5rem;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    /* Tickle Animation */
    @keyframes tickleShake {
      0%, 100% { transform: rotate(0deg) scale(1); }
      20% { transform: rotate(-15deg) scale(1.1) translateX(-10px); }
      40% { transform: rotate(15deg) scale(1.1) translateX(10px); }
      60% { transform: rotate(-10deg) scale(1.1) translateX(-5px); }
      80% { transform: rotate(10deg) scale(1.1) translateX(5px); }
    }
    .tickle-active {
      animation: tickleShake 0.6s ease-in-out infinite;
    }

    /* Floating ambient animations */
    @keyframes floaty {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .ambient-float {
      animation: floaty 4s ease-in-out infinite;
    }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 4px; }
  </style>
</head>
<body class="flex flex-col items-center justify-start p-4 sm:p-8 text-slate-800 relative">

  <!-- Ambient background decorations -->
  <div class="fixed top-10 left-10 text-5xl opacity-50 ambient-float" style="animation-delay: 0s;">🌸</div>
  <div class="fixed bottom-20 right-10 text-5xl opacity-50 ambient-float" style="animation-delay: 1s;">🌼</div>
  <div class="fixed top-40 right-20 text-4xl opacity-50 ambient-float" style="animation-delay: 2s;">✨</div>
  <div class="fixed bottom-40 left-20 text-6xl opacity-30 ambient-float" style="animation-delay: 1.5s;">🌿</div>

  <header class="z-10 w-full max-w-3xl mx-auto text-center mt-4 mb-8">
    <div class="inline-flex items-center gap-2 bg-pink-100/90 text-pink-800 px-5 py-2 rounded-full text-sm font-bold mb-4 shadow-sm border border-pink-200">
      <span>👑</span> OFFICIALLY SANCTIONED BY BESTIE LAW <span>👑</span>
    </div>
    <h1 class="fun-font text-4xl sm:text-5xl md:text-6xl font-extrabold text-pink-500 tracking-tight drop-shadow-sm leading-tight">
      Prachiti's Playful<br>
      <span class="text-emerald-500">Punishment Chamber</span>
    </h1>
    <p class="text-base font-bold text-slate-500 mt-3">(For Sangram! 🤭)</p>
  </header>

  <main class="z-10 w-full max-w-4xl grid grid-cols-1 md:grid-cols-2 gap-8 pb-20">

    <!-- LEFT COLUMN: Sangram Representation -->
    <div class="flex flex-col items-center justify-center">
      <div class="floral-card rounded-[3rem] p-8 flex flex-col items-center w-full max-w-sm relative overflow-hidden">
        
        <!-- Decorative frame -->
        <div class="absolute -top-4 -left-4 text-5xl">🌿</div>
        <div class="absolute -bottom-4 -right-4 text-5xl">🌺</div>
        
        <h2 class="fun-font text-2xl font-bold text-slate-700 mb-6 text-center z-10">The Guilty Party</h2>
        
        <!-- SVG Avatar for Sangram -->
        <div id="sangram-avatar" class="relative z-10 transition-transform duration-300 drop-shadow-xl cursor-pointer" onclick="tickleSangram()">
          <svg width="220" height="220" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <!-- Backdrop glow -->
            <circle cx="100" cy="100" r="90" fill="#fef3c7" />
            <!-- Body/Hoodie -->
            <path d="M 40 180 Q 40 120 100 120 Q 160 120 160 180" fill="#64748b" />
            <!-- Head -->
            <circle cx="100" cy="85" r="45" fill="#fcd34d" />
            <!-- Hair -->
            <path d="M 50 80 Q 60 40 100 35 Q 140 40 145 85 Q 120 50 100 55 Q 70 50 50 80" fill="#1e293b" />
            <!-- Eyes (Guilty/Nervous) -->
            <ellipse cx="85" cy="85" rx="5" ry="8" fill="#1e293b" />
            <ellipse cx="115" cy="85" rx="5" ry="8" fill="#1e293b" />
            <path d="M 75 75 Q 85 70 95 78" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
            <path d="M 125 75 Q 115 70 105 78" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
            <!-- Sweat drop -->
            <path d="M 135 65 Q 145 65 140 80 Q 135 80 135 65" fill="#38bdf8" />
            <!-- Mouth (Awkward smile) -->
            <path d="M 90 105 Q 100 110 110 103" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
            <!-- Blush -->
            <ellipse cx="70" cy="95" rx="8" ry="4" fill="#f87171" opacity="0.6"/>
            <ellipse cx="130" cy="95" rx="8" ry="4" fill="#f87171" opacity="0.6"/>
          </svg>
          <!-- Confession Sign -->
          <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 bg-white px-4 py-2 rounded-xl border-2 border-slate-200 shadow-md transform rotate-3 whitespace-nowrap">
            <span class="fun-font text-sm font-bold text-slate-600">"I am at your mercy!" 🥺</span>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT COLUMN: Punishment Controls -->
    <div class="flex flex-col gap-5">
      
      <!-- Option 1: Floral Sentence -->
      <button onclick="triggerFloral()" class="floral-card group rounded-2xl p-4 flex items-center gap-4 hover:-translate-y-1 hover:shadow-lg transition-all active:scale-95 text-left border-l-8 border-l-pink-400">
        <div class="bg-pink-100 text-pink-500 text-3xl w-14 h-14 rounded-full flex items-center justify-center shrink-0 group-hover:rotate-12 transition-transform">🌸</div>
        <div>
          <h3 class="fun-font text-xl font-bold text-slate-800">1. Floral Sentence</h3>
          <p class="text-sm font-bold text-slate-500">Drown him in a barrage of cute flowers!</p>
        </div>
      </button>

      <!-- Option 2: Guilty Pleasure -->
      <button onclick="triggerFood()" class="floral-card group rounded-2xl p-4 flex items-center gap-4 hover:-translate-y-1 hover:shadow-lg transition-all active:scale-95 text-left border-l-8 border-l-amber-400">
        <div class="bg-amber-100 text-amber-500 text-3xl w-14 h-14 rounded-full flex items-center justify-center shrink-0 group-hover:-rotate-12 transition-transform">🍔</div>
        <div>
          <h3 class="fun-font text-xl font-bold text-slate-800">2. Guilty Pleasure Drop</h3>
          <p class="text-sm font-bold text-slate-500">Make it rain pizza, burgers, and boba!</p>
        </div>
      </button>

      <!-- Option 3: Tickle-Torture -->
      <button onclick="tickleSangram()" class="floral-card group rounded-2xl p-4 flex items-center gap-4 hover:-translate-y-1 hover:shadow-lg transition-all active:scale-95 text-left border-l-8 border-l-emerald-400">
        <div class="bg-emerald-100 text-emerald-500 text-3xl w-14 h-14 rounded-full flex items-center justify-center shrink-0 group-hover:scale-110 transition-transform">🪶</div>
        <div>
          <h3 class="fun-font text-xl font-bold text-slate-800">3. Tickle-Torture</h3>
          <p class="text-sm font-bold text-slate-500">Make him jiggle and shake uncontrollably!</p>
        </div>
      </button>

      <!-- Option 4: The Big Promise -->
      <div class="floral-card rounded-2xl p-5 flex flex-col gap-3 border-l-8 border-l-purple-400">
        <div class="flex items-center gap-3">
          <div class="bg-purple-100 text-purple-500 text-2xl w-10 h-10 rounded-full flex items-center justify-center shrink-0">📜</div>
          <h3 class="fun-font text-xl font-bold text-slate-800">4. The Big Promise</h3>
        </div>
        <p class="text-sm font-bold text-slate-500">Type a promise he absolutely MUST keep:</p>
        <div class="flex gap-2">
          <input type="text" id="promise-input" placeholder="e.g. Treat me to iced coffee..." class="flex-1 bg-white/50 border-2 border-purple-200 rounded-xl px-4 py-2 font-semibold text-slate-700 outline-none focus:border-purple-400 transition-colors">
          <button onclick="submitPromise()" class="bg-purple-500 hover:bg-purple-600 text-white font-bold px-4 py-2 rounded-xl transition-colors active:scale-95 whitespace-nowrap shadow-md">
            Submit! ✨
          </button>
        </div>
        <div id="promise-feedback" class="text-xs font-bold text-purple-600 hidden mt-1 bg-purple-100 p-2 rounded-lg text-center"></div>
      </div>

    </div>
  </main>

  <script>
    // Audio Context Setup for cute sound effects
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let actx;

    function initAudio() {
      if (!actx) actx = new AudioContext();
      if (actx.state === 'suspended') actx.resume();
    }

    function playPopSound(freq = 400) {
      initAudio();
      const osc = actx.createOscillator();
      const gain = actx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, actx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.5, actx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.1, actx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(actx.destination);
      osc.start();
      osc.stop(actx.currentTime + 0.1);
    }

    function playTickleSound() {
      initAudio();
      let time = actx.currentTime;
      for (let i = 0; i < 5; i++) {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600 + (Math.random() * 400), time + (i * 0.1));
        gain.gain.setValueAtTime(0.05, time + (i * 0.1));
        gain.gain.exponentialRampToValueAtTime(0.01, time + (i * 0.1) + 0.05);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start(time + (i * 0.1));
        osc.stop(time + (i * 0.1) + 0.05);
      }
    }

    function playSuccessSound() {
      initAudio();
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, i) => {
        setTimeout(() => {
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, actx.currentTime);
          gain.gain.setValueAtTime(0.1, actx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 0.2);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start();
          osc.stop(actx.currentTime + 0.2);
        }, i * 100);
      });
    }

    // --- Helper for Falling Emojis ---
    function spawnFallingEmojis(emojisList, count) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'falling-emoji';
          el.innerText = emojisList[Math.floor(Math.random() * emojisList.length)];
          
          // Randomize horizontal position and animation duration slightly
          el.style.left = Math.random() * 90 + 'vw';
          const duration = 2.5 + Math.random() * 1.5;
          el.style.animationDuration = duration + 's';
          
          // Randomize size
          const size = 1.5 + Math.random() * 2;
          el.style.fontSize = size + 'rem';

          document.body.appendChild(el);
          
          // Optional pop sound on spawn
          if (Math.random() > 0.5) playPopSound(300 + Math.random() * 400);

          // Clean up after animation finishes
          setTimeout(() => el.remove(), duration * 1000);
        }, i * 150); // Stagger the drops
      }
    }

    // --- Button 1: Floral Sentence ---
    function triggerFloral() {
      const flowers = ['🌸', '🌼', '🌻', '🌺', '🌷', '🌹', '🌿'];
      spawnFallingEmojis(flowers, 20);
    }

    // --- Button 2: Guilty Pleasure ---
    function triggerFood() {
      const food = ['🍕', '🍔', '🧋', '🍩', '🍟', '🍦', '🍰'];
      spawnFallingEmojis(food, 20);
    }

    // --- Button 3: Tickle-Torture ---
    function tickleSangram() {
      playTickleSound();
      const avatar = document.getElementById('sangram-avatar');
      
      // Prevent resetting animation if already tickling
      if (avatar.classList.contains('tickle-active')) return;
      
      avatar.classList.add('tickle-active');
      
      // Update confession text temporarily
      const signText = avatar.querySelector('span');
      const oldText = signText.innerText;
      signText.innerText = "HAHAHA STOP IT! 🤣";
      signText.classList.add('text-rose-500');

      setTimeout(() => {
        avatar.classList.remove('tickle-active');
        signText.innerText = oldText;
        signText.classList.remove('text-rose-500');
      }, 1500); // Shake for 1.5 seconds
    }

    // --- Button 4: Submit Promise ---
    function submitPromise() {
      const input = document.getElementById('promise-input');
      const feedback = document.getElementById('promise-feedback');
      const val = input.value.trim();

      if (!val) {
        // Shake input if empty
        input.classList.add('border-rose-500');
        setTimeout(() => input.classList.remove('border-rose-500'), 500);
        return;
      }

      playSuccessSound();

      // Confetti burst
      const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };
      function randomInRange(min, max) { return Math.random() * (max - min) + min; }
      const interval = setInterval(function() {
        const timeLeft = animationEnd - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        const particleCount = 50 * (timeLeft / 1000);
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
        confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
      }, 250);
      const animationEnd = Date.now() + 1500;

      // Show Feedback
      input.value = "";
      feedback.innerHTML = `Signed and sealed! Sangram MUST: <br><span class="text-emerald-600">"${val}"</span>`;
      feedback.classList.remove('hidden');
    }
  </script>
</body>
</html>
